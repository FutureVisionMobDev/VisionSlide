[package]
name = "visionslide-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VisionSlide engine: sessions, undo history, selection, the command registry every frontend dispatches through, and pointer tools"

[lints]
workspace = true

[dependencies]
craft-mime = { workspace = true }
visionslide-geom = { workspace = true }
visionslide-color = { workspace = true }
visionslide-model = { workspace = true }
visionslide-fonts = { workspace = true }
visionslide-text = { workspace = true }
visionslide-render = { workspace = true }
visionslide-pdf = { workspace = true }
visionslide-format = { workspace = true }
visionslide-pptx = { workspace = true }
visionslide-ppt = { workspace = true }
visionslide-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
i_overlay = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
visionslide-anim = { workspace = true }
zip = { workspace = true }

# The browser clock for comment timestamps (wasm has no std::time::SystemTime).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"


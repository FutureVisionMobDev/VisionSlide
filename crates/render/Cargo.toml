[package]
name = "visionslide-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VisionSlide renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
visionslide-geom = { workspace = true }
visionslide-color = { workspace = true }
craft-metafile = { workspace = true }
visionslide-model = { workspace = true }
visionslide-anim = { workspace = true }
visionslide-fonts = { workspace = true }
visionslide-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }

[dev-dependencies]
craft-metafile = { workspace = true, features = ["write"] }
